name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: PHP - Lint, Analyse, Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: laracorz
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: laracorz_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i "s|DB_CONNECTION=.*|DB_CONNECTION=pgsql|" .env
          sed -i "s|DB_HOST=.*|DB_HOST=127.0.0.1|" .env
          sed -i "s|DB_DATABASE=.*|DB_DATABASE=laracorz_test|" .env
          sed -i "s|DB_USERNAME=.*|DB_USERNAME=laracorz|" .env
          sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=secret|" .env
          php artisan key:generate

      - name: Migrate
        run: php artisan migrate --force

      - name: Lint
        run: ./vendor/bin/pint --test

      - name: Analyse
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

      - name: Test
        run: php artisan test

  frontend:
    name: JS - Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Test
        run: npm run test:run || true

      - name: Build
        run: npm run build
